[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-flow"
version = "0.1.0"
description = "Lightweight, sub-millisecond asynchronous DAG pipeline & event-driven orchestrator for autonomous agent swarms."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ghost Swarm Core Team"}
]
dependencies = [
    "aiohttp>=3.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
ghost-flow = "ghost_flow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
